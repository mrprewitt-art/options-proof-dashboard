services:
  - type: web
    name: options-proof-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRADE_INGEST_SECRET
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BRAND_NAME
        value: Private Options Alerts
      - key: MONTHLY_STARS
        value: "500"
